server:
  # Render / 容器会注入 PORT；需监听 0.0.0.0 才能被平台探测到开放端口
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: software-test-platform

  # Python 脚本执行器配置
  python:
    # Python 命令路径，支持环境变量覆盖
    # 本地 Windows: py
    # 云端部署: python3 或 /usr/bin/python3
    command: ${PYTHON_COMMAND:py}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/test_platform;DB_CLOSE_DELAY=-1;MODE=MySQL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.h2.Driver
    hikari:
      # 云端空闲恢复后，尽量不要长期保留失效连接
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:540000}
      keepalive-time: ${DB_KEEPALIVE_MS:240000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      connection-test-query: ${DB_CONNECTION_TEST_QUERY:SELECT 1}

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      continue-on-error: false
      encoding: UTF-8

  h2:
    console:
      enabled: true
      path: /h2-console

# JWT（生产环境请更换 secret 并使用环境变量）
app:
  jwt:
    secret: ${JWT_SECRET:software-test-platform-jwt-secret-key-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ui-test:
    ai:
      enabled: ${UI_TEST_AI_ENABLED:false}
      provider: ${UI_TEST_AI_PROVIDER:dashscope}
      endpoint: ${UI_TEST_AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      api-key: ${UI_TEST_AI_API_KEY:}
      model: ${UI_TEST_AI_MODEL:qwen-plus}
      timeout-ms: ${UI_TEST_AI_TIMEOUT_MS:30000}
      min-confidence: ${UI_TEST_AI_MIN_CONFIDENCE:0.7}
